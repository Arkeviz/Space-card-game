# Весь стек одной командой: `pnpm docker:up` -> http://localhost:8181
# Только база для разработки (сервер и клиент запускаются из IDE): `pnpm db:up`.
# Пароли и лимиты берутся из файла .env рядом с этим файлом (образец - .env.example).
name: space-card-game

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      # Суперпользователь postgres - только для обслуживания. Сервер ходит ролью space без прав суперпользователя:
      # её создаёт docker/postgres/01-app-role.sh при первой инициализации тома.
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env, образец - .env.example}'
      POSTGRES_DB: space
      APP_DB_PASSWORD: '${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD в .env, образец - .env.example}'
    # Порт наружу нужен для разработки: сервер из IDE подключается к localhost:5432. Только с этой машины.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # По TCP: пока том инициализируется, postgres слушает только локальный сокет, и сервер не начнёт
      # подключаться раньше, чем создана его роль.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U space -d space]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: 'postgres://space:${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD в .env, образец - .env.example}@db:5432/space'
      MATCH_RETENTION_DAYS: '14'
      # Адрес клиента берётся из X-Forwarded-For, который ставит nginx клиента (он в частной сети Docker).
      TRUST_PROXY: uniquelocal
      # Лимиты по адресу клиента, 0 - выключены. Под Docker Desktop все игроки приходят с одного адреса шлюза Docker,
      # и лимит стал бы общим на всех, поэтому по умолчанию выключены (подробнее - .env.example).
      MAX_CONNECTIONS_PER_IP: '${MAX_CONNECTIONS_PER_IP:-0}'
      MATCH_STARTS_PER_HOUR: '${MATCH_STARTS_PER_HOUR:-0}'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:3001/health']
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    ports:
      - '8181:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
