server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # WebSocket игры. Адрес сервера задаётся переменной, а не прямо в proxy_pass: так nginx стартует, даже если
  # сервер ещё не поднялся (имя резолвится при запросе через встроенный DNS Docker).
  location /ws {
    resolver 127.0.0.11 valid=10s;
    set $game_server http://server:3001;
    proxy_pass $game_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Клиент шлёт heartbeat раз в 15 секунд: соединение не считается простаивающим.
    proxy_read_timeout 1h;
  }

  # Файлы с хэшем в имени можно кэшировать надолго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Остальное - одностраничное приложение: любой путь отдаёт index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
