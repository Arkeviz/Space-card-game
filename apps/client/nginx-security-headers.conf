# Заголовки безопасности. Подключаются в каждом location (include): add_header внутри location отменяет
# унаследованные с уровня server.
#
# CSP: скрипты только свои (в сборке Vite нет inline-скриптов и eval); стили свои, Google Fonts и inline (статичные
# style в шаблонах Vue); соединения - только с тем же хостом (WebSocket /ws); встраивать страницу во фрейм нельзя.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# То же для браузеров без frame-ancestors: игру нельзя встроить в чужую страницу и подвести игрока к кнопке «сдаться».
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
