name: Deploy to GitHub Pages

# Публикует только клиент (статику). Игровой сервер на Pages запустить нельзя: адрес своего сервера
# задаётся переменной репозитория PAGES_WS_URL (например, wss://game.example.com/ws).
#
# Автоматический деплой при каждом пуше в main включается флагом: Settings -> Secrets and variables -> Actions ->
# Variables -> DEPLOY_PAGES = true. Без флага работает только ручной запуск (Actions -> Deploy to GitHub Pages -> Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @space/client build
        env:
          # Проектный сайт лежит по адресу https://<владелец>.github.io/<репозиторий>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_WS_URL: ${{ vars.PAGES_WS_URL }}
      # Pages не умеет отдавать index.html для неизвестных путей, но отдаёт 404.html: так работают прямые ссылки (/cards).
      - run: cp apps/client/dist/index.html apps/client/dist/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/client/dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
