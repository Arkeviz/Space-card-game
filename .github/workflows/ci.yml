name: CI

on:
  push:
    branches: [main]
  pull_request:

# Токену GITHUB_TOKEN нужно только читать код. Экшены закреплены по SHA коммита (в комментарии - версия):
# тег можно переписать, коммит - нет. Обновления предлагает Dependabot (.github/dependabot.yml).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Нужна интеграционному тесту хранилища партий (apps/server/src/storage/postgres-repository.test.ts).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: space
          POSTGRES_PASSWORD: space
          POSTGRES_DB: space
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space -d space"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://space:space@localhost:5432/space
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Версию pnpm берёт из packageManager корневого package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    # Образы только собираются, не публикуются: проверка, что Dockerfile'ы рабочие.
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - {name: server, dockerfile: apps/server/Dockerfile}
          - {name: client, dockerfile: apps/client/Dockerfile}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
