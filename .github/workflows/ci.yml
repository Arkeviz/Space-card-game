name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ручной перезапуск: на main после проверок ещё и деплой.
  workflow_dispatch:

# Токену GITHUB_TOKEN нужно только читать код.
permissions:
  contents: read

# Устаревшие проверки PR отменяются; на main новый запуск ждёт предыдущий, чтобы не оборвать деплой на середине.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Нужна интеграционному тесту хранилища партий (apps/server/src/storage/postgres-repository.test.ts).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: space
          POSTGRES_PASSWORD: space
          POSTGRES_DB: space
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space -d space"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://space:space@localhost:5432/space
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Версию pnpm берёт из packageManager корневого package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Сборка образов отключена ради минут GitHub Actions: образы и так собирает деплой на сервере, и сломанный Dockerfile
  # роняет job deploy. Вернуть - раскомментировать блок и добавить docker в needs у deploy.
  # docker:
  #   # Образы только собираются, не публикуются: проверка, что Dockerfile'ы рабочие.
  #   needs: check
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       image:
  #         - {name: server, dockerfile: apps/server/Dockerfile}
  #         - {name: client, dockerfile: apps/client/Dockerfile}
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         persist-credentials: false
  #     - uses: docker/setup-buildx-action@v3
  #     - uses: docker/build-push-action@v6
  #       with:
  #         context: .
  #         file: ${{ matrix.image.dockerfile }}
  #         push: false
  #         cache-from: type=gha,scope=${{ matrix.image.name }}
  #         cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  deploy:
    # Выкладка на боевой сервер (deploy/deploy.sh по SSH). Включается переменной репозитория DEPLOY_ENABLED = true,
    # секреты - в окружении production; настройка - apps/server/README.md, раздел «Автодеплой».
    needs: check
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Ключу на сервере разрешена только команда deploy/deploy.sh, аргумент - SHA коммита.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
