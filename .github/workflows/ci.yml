name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Нужна интеграционному тесту хранилища партий (apps/server/src/storage/postgres-repository.test.ts).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: space
          POSTGRES_PASSWORD: space
          POSTGRES_DB: space
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space -d space"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://space:space@localhost:5432/space
    steps:
      - uses: actions/checkout@v4
      # Версию pnpm берёт из packageManager корневого package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    # Образы только собираются, не публикуются: проверка, что Dockerfile'ы рабочие.
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - {name: server, dockerfile: apps/server/Dockerfile}
          - {name: client, dockerfile: apps/client/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
