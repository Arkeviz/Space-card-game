# Экшены в workflow закреплены по SHA коммита: без обновлений они бы устаревали. Для образов Dependabot предлагает новые версии тегов (node 24 -> 26 и т. п.).
# Dependabot раз в неделю предлагает обновления одним PR на каждую экосистему.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /apps/server
      - /apps/client
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
